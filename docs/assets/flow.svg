<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 228" role="img" aria-labelledby="flowTitle flowDesc">
  <title id="flowTitle">How SkillLib turns repositories into a skill an agent can load</title>
  <desc id="flowDesc">Four steps: search 179 repositories, judge 32977 skill files down to 21516 leading skills, index them into 13 domains, then find and load at most three procedures.</desc>
  <rect fill="#fbf8f3" stroke="#241f1a" stroke-width="1.4" x="8" y="16" width="210" height="196"/>
  <rect fill="#fbf8f3" stroke="#241f1a" stroke-width="1.4" x="258" y="16" width="210" height="196"/>
  <rect fill="#fbf8f3" stroke="#241f1a" stroke-width="1.4" x="508" y="16" width="210" height="196"/>
  <rect fill="#fbf8f3" stroke="#241f1a" stroke-width="1.4" x="758" y="16" width="210" height="196"/>
  <path stroke="#241f1a" stroke-width="1.4" fill="none" d="M218 114 H250"/>
  <path stroke="#241f1a" stroke-width="1.4" fill="none" d="M468 114 H500"/>
  <path stroke="#241f1a" stroke-width="1.4" fill="none" d="M718 114 H750"/>
  <path fill="#241f1a" d="M244 114 l-8 -5 v10 z"/>
  <path fill="#241f1a" d="M494 114 l-8 -5 v10 z"/>
  <path fill="#241f1a" d="M744 114 l-8 -5 v10 z"/>
  <g fill="#8f2d2d" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.6">
    <text x="24" y="42">01  SEARCH</text>
    <text x="274" y="42">02  JUDGE</text>
    <text x="524" y="42">03  INDEX</text>
    <text x="774" y="42">04  USE</text>
  </g>
  <g fill="#241f1a" font-family="Georgia, Palatino, serif">
    <text font-size="28" x="24" y="84">179</text>
    <text font-size="20" x="24" y="114">repositories</text>
    <text font-size="28" x="274" y="84">21,516</text>
    <text font-size="20" x="274" y="114">leading skills</text>
    <text font-size="28" x="524" y="84">13</text>
    <text font-size="20" x="524" y="114">domains</text>
    <text font-size="28" x="774" y="84">3</text>
    <text font-size="20" x="774" y="114">calls</text>
  </g>
  <g fill="#5c564c" font-family="Georgia, Palatino, serif" font-size="13">
    <text x="24" y="142">Skill content above</text>
    <text x="24" y="162">1,000 stars, plus</text>
    <text x="24" y="182">15 collections.</text>
    <text x="274" y="142">From 32,977 files.</text>
    <text x="274" y="162">One authentic copy,</text>
    <text x="274" y="182">or one combined skill.</text>
    <text x="524" y="142">13,320 scenarios.</text>
    <text x="524" y="162">389 task families.</text>
    <text x="524" y="182">964 product channels.</text>
    <text x="774" y="142">find_skills, then</text>
    <text x="774" y="162">load_skill. At most</text>
    <text x="774" y="182">three bodies loaded.</text>
  </g>
</svg>
