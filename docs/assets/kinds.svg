<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 168" role="img" aria-labelledby="kindsTitle kindsDesc">
  <title id="kindsTitle">Three kinds of leading skill</title>
  <desc id="kindsDesc">15642 separate skills, 3784 authentic skills, and 752 combined skills.</desc>
  <rect fill="#fbf8f3" stroke="#241f1a" stroke-width="1.4" x="8" y="8" width="300" height="152"/>
  <rect fill="#fbf8f3" stroke="#241f1a" stroke-width="1.4" x="340" y="8" width="300" height="152"/>
  <rect fill="#fbf8f3" stroke="#241f1a" stroke-width="1.4" x="672" y="8" width="300" height="152"/>
  <g fill="#8f2d2d" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.5">
    <text x="24" y="36">SEPARATE</text>
    <text x="356" y="36">AUTHENTIC</text>
    <text x="688" y="36">COMBINED</text>
  </g>
  <g fill="#241f1a" font-family="Georgia, Palatino, serif" font-size="32">
    <text x="24" y="78">15,642</text>
    <text x="356" y="78">3,784</text>
    <text x="688" y="78">752</text>
  </g>
  <g fill="#5c564c" font-family="Georgia, Palatino, serif" font-size="14">
    <text x="24" y="108">The name occurs once.</text>
    <text x="24" y="130">That copy is the skill.</text>
    <text x="356" y="108">Several copies agree.</text>
    <text x="356" y="130">Follow the chosen one.</text>
    <text x="688" y="108">Copies disagree.</text>
    <text x="688" y="130">Follow the conflict note.</text>
  </g>
</svg>
