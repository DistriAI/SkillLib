[project]
name = "skilllib"
version = "0.1.0"
description = "SkillLib searches, catalogs, and caches GitHub repositories of Anthropic- and OpenAI-compatible LLM agent skills."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = []

[project.scripts]
skilllib = "skilllib.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
